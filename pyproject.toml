[project]
name = "infonium"
version = "0.1.0"
description = "Digest web pages, PDFs, podcasts and videos into cited summaries that link back to the source."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.163.0",
    "filelock>=4.2.10",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "m3u8>=6.0.0",
    "openai>=3.51.0",
    "playwright>=1.65.2",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
    # With its default set, for requests: read through it, a download is held to its size.
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
infonium-protocol = "infonium.openapi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run refuses the network, and leaves out the tests that need a program of their
# own; `-m` with a marker's name runs those.
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
    "-m",
    "not chrome and not ffmpeg and not mineru",
]
markers = [
    "chrome: renders pages in Google Chrome or Chromium, with its sandbox",
    "ffmpeg: reads recordings with FFmpeg's ffmpeg and ffprobe",
    "mineru: parses PDFs with MinerU 3.4.2 on a GPU",
]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["filetype", "pypdfium2"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
    "types-lxml>=2026.2.16",
    "types-m3u8>=6.0.0.20260518",
    "types-psutil>=7.2.2.20261111",
    "types-yt-dlp>=2026.8.19.20261030",
]
